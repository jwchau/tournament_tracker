server {
    listen 80;
    root /usr/share/nginx/html;

    # SPA fallback: deep links like /brackets/3 load the app, which routes them.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Built assets have content hashes in their names, so they never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Always revalidate the page itself, so a rebuild is picked up on reload.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
